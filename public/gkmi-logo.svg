<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Globe circle outline -->
  <circle cx="100" cy="120" r="78" stroke="#111" stroke-width="8" fill="white"/>
  
  <!-- Horizontal equator line -->
  <line x1="22" y1="120" x2="178" y2="120" stroke="#111" stroke-width="5"/>
  
  <!-- Vertical meridian line inside globe -->
  <line x1="100" y1="42" x2="100" y2="198" stroke="#111" stroke-width="5"/>
  
  <!-- Upper arc (latitude line upper half) -->
  <path d="M 30 85 Q 100 65 170 85" stroke="#111" stroke-width="4" fill="none"/>
  
  <!-- Lower arc (latitude line lower half) -->
  <path d="M 30 155 Q 100 175 170 155" stroke="#111" stroke-width="4" fill="none"/>

  <!-- Red Cross - vertical bar (goes beyond globe top and bottom) -->
  <rect x="88" y="4" width="24" height="232" rx="3" fill="#CC1F1F"/>
  
  <!-- Red Cross - horizontal bar -->
  <rect x="42" y="78" width="116" height="24" rx="3" fill="#CC1F1F"/>

  <!-- Blue fish (Ichthus) body - positioned in lower center of globe -->
  <ellipse cx="100" cy="145" rx="38" ry="20" fill="#2B7FC1"/>
  
  <!-- Fish tail left fin -->
  <polygon points="62,145 46,130 46,160" fill="#2B7FC1"/>
  
  <!-- Blue square/rectangle below fish (decorative geometric) -->
  <rect x="76" y="155" width="30" height="18" rx="2" fill="#2B7FC1"/>
  
  <!-- Blue rectangle left (geometric accent) -->
  <rect x="58" y="138" width="18" height="14" rx="2" fill="#2B7FC1"/>

  <!-- Fish eye -->
  <circle cx="128" cy="141" r="4" fill="white"/>
  <circle cx="128" cy="141" r="2" fill="#1a5c8f"/>

  <!-- Fish tail right (right side curve) -->
  <path d="M 138 145 Q 152 132 156 145 Q 152 158 138 145Z" fill="#2B7FC1"/>
</svg>
